  const cancRate=D.n_cancel_orders/D.total_unique_orders;
  return `<div class="phead"><div><h2>Tổng quan</h2></div></div>
  <div class="kgrid">
    ${kpi('GMV (đơn hoàn thành)',fmt(D.gmv),'Giá trị người mua thanh toán','b')}
    ${kpi('Doanh thu thuần',fmt(D.revenue),'Sau phí sàn',D.revenue>0?'g':'r')}
    ${kpi('Lợi nhuận gộp (trừ giá vốn)',fmt(D.gross_profit),'GM '+pct(D.gross_margin),'y')}
    ${kpi('Lợi nhuận ròng',fmt(D.net_profit),'NM '+pct(D.net_margin)+' · sau Ads',D.net_profit>0?'g':'r',D.net_profit>0?'up':'dn')}
    ${kpi('Tổng đơn (unique)',D.total_unique_orders.toLocaleString('vi'),'Hoàn thành '+D.n_completed_orders.toLocaleString('vi'),'')}
    ${kpi('Đơn hủy / hoàn',D.n_cancel_orders+' / '+D.n_refund_orders,'Tỷ lệ hủy '+pct(cancRate),'r','dn')}
    ${kpi('Giá trị hủy / hoàn',fmt(D.cancel_value)+' / '+fmt(D.refund_value),'GMV hủy + giá trị hoàn','r')}
    ${kpi('SKU đã bán',D.sku_sold,D.units_sold.toLocaleString('vi')+' sản phẩm','p')}
    ${kpi('AOV',fmtF(D.aov),'Doanh thu / đơn HT','')}
  </div>
  <div class="panel" style="margin-bottom:16px"><h3>GMV & Doanh thu theo từng ngày <span class="note">(${D.period||''})</span></h3><div id="c_gmv" class="chart" style="height:330px"></div></div>
  <div class="panel" style="margin-bottom:16px"><h3>Đơn hàng theo từng ngày <span class="note">(hoàn thành vs hủy)</span></h3><div id="c_ord" class="chart" style="height:300px"></div></div>
  <div class="row3">
    <div class="panel"><h3>Doanh thu tích lũy theo ngày</h3><div id="c_cum" class="chart"></div></div>
    <div class="panel"><h3>Cơ cấu trạng thái đơn</h3><div id="c_status" class="chart"></div></div>
  </div>`;
};
PAGES.overview.draw=()=>{
  Plotly.newPlot('c_gmv',[
    {x:days,y:D.daily.map(x=>x.gmv),type:'bar',name:'GMV',marker:{color:C.blu}},
    {x:days,y:D.daily.map(x=>x.revenue),type:'scatter',mode:'lines+markers',name:'Doanh thu',line:{color:C.acc,width:2.5},marker:{size:4}}
  ],{...PLT(),xaxis:DAILYX(),hovermode:'x unified'},CFG);
  Plotly.newPlot('c_ord',[
    {x:days,y:D.daily.map(x=>x.orders),type:'bar',name:'Hoàn thành',marker:{color:C.grn}},
    {x:days,y:D.daily.map(x=>x.cancel),type:'bar',name:'Hủy',marker:{color:C.red}}
  ],{...PLT(),barmode:'group',xaxis:DAILYX(),hovermode:'x unified'},CFG);
  let cum=0;const cumv=D.daily.map(x=>cum+=x.revenue);
  Plotly.newPlot('c_cum',[{x:days,y:cumv,type:'scatter',fill:'tozeroy',mode:'lines',line:{color:C.acc2,width:2},fillcolor:'rgba(255,115,55,.15)'}],{...PLT(),xaxis:DAILYX()},CFG);
  Plotly.newPlot('c_status',[{values:[D.n_completed_orders,D.n_cancel_orders,D.n_refund_orders],labels:['Hoàn thành','Đã hủy','Hoàn/trả'],type:'pie',hole:.55,marker:{colors:[C.grn,C.red,C.yel]},textinfo:'percent+value'}],{...PLT(),margin:{t:10,r:10,b:10,l:10},showlegend:true},CFG);
};

// 2. COST
PAGES.cost=()=>{
  const ship=D.shipping_fee||0, disc=D.discount_subsidy||0;
  const totalCost=D.platform_fee+D.ads_spend+D.aff_fee+ship+disc;
  return `<div class="phead"><div><h2>Chi phí</h2><p>Phí sàn, quảng cáo, affiliate & cơ cấu chi phí</p></div></div>
  <div class="kgrid">
    ${kpi('Tổng phí sàn',fmt(D.platform_fee),pct(D.platform_fee/D.gmv)+' / GMV','r')}
    ${kpi('Phí hoa hồng cố định',fmt(D.fee_fixed),pct(D.fee_fixed/D.gmv)+' / GMV','r')}
    ${kpi('Phí dịch vụ',fmt(D.fee_service),pct(D.fee_service/D.gmv)+' / GMV','y')}
    ${kpi('Phí thanh toán',fmt(D.fee_txn),pct(D.fee_txn/D.gmv)+' / GMV','y')}
    ${kpi('Phí Ads',fmt(D.ads_spend),pct(D.ads_ratio)+' / Doanh thu','p')}
    ${kpi('Phí Affiliate (KOL)',fmt(D.aff_fee),pct(D.aff_ratio)+' / Doanh thu','b')}
    ${ship?kpi('Phí vận chuyển',fmt(ship),pct(ship/D.gmv)+' / GMV','y'):''}
    ${disc?kpi('Giảm giá & trợ giá',fmt(disc),pct(disc/D.gmv)+' / GMV','y'):''}
    ${kpi('Tổng chi phí',fmt(totalCost),pct(totalCost/D.gmv)+' / GMV','r')}
  </div>
  <div class="row3">
    <div class="panel"><h3>Cơ cấu chi phí</h3><div id="c_costmix" class="chart"></div></div>
    <div class="panel"><h3>Doanh thu vs Phí sàn theo từng ngày</h3><div id="c_revcost" class="chart"></div></div>
  </div>`;
};
PAGES.cost.draw=()=>{
  const ship=D.shipping_fee||0, disc=D.discount_subsidy||0;
  const vals=[D.fee_fixed,D.fee_service,D.fee_txn,D.ads_spend,D.aff_fee], labs=['Hoa hồng sàn','Phí dịch vụ','Phí thanh toán','Ads','Affiliate'], cols=[C.red,C.yel,C.acc2,C.pur,C.blu];
  if(ship){vals.push(ship);labs.push('Vận chuyển');cols.push(C.grn);}
  if(disc){vals.push(disc);labs.push('Giảm giá & trợ giá');cols.push('#7d8db3');}
  Plotly.newPlot('c_costmix',[{values:vals,labels:labs,type:'pie',hole:.5,marker:{colors:cols},textinfo:'percent'}],{...PLT(),margin:{t:10,r:10,b:10,l:10}},CFG);
  const feeRatio=(D.gmv-D.revenue)/D.gmv;
  Plotly.newPlot('c_revcost',[
    {x:days,y:D.daily.map(x=>x.revenue),type:'bar',name:'Doanh thu',marker:{color:C.grn}},
    {x:days,y:D.daily.map(x=>x.gmv*feeRatio),type:'bar',name:'Phí sàn (ước)',marker:{color:C.red}}
  ],{...PLT(),barmode:'group',xaxis:DAILYX(),hovermode:'x unified'},CFG);
};

// 3. SKU
function skuTable(rows,id,cols){
  const head=cols.map((c,i)=>`<th onclick="sortTbl('${id}',${i},${c.num?1:0})">${c.t}</th>`).join('');
  const body=rows.map(r=>`<tr>${cols.map(c=>`<td>${c.r(r)}</td>`).join('')}</tr>`).join('');
  return `<div class="tbl-wrap"><table id="${id}"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}
PAGES.sku=()=>{
  const t=D.by_type;
  return `<div class="phead"><div><h2>Phân tích SKU</h2><p>Doanh số theo nhóm sản phẩm & chi tiết SKU</p></div></div>
  <div class="row2">
    <div class="panel"><h3>GMV theo nhóm sản phẩm (Top 12)</h3><div id="c_typegmv" class="chart" style="height:380px"></div></div>
    <div class="panel"><h3>Tỷ trọng GMV nhóm SP</h3><div id="c_typepie" class="chart" style="height:380px"></div></div>
  </div>
  <div class="panel"><h3>Chi tiết theo nhóm sản phẩm</h3>
    <input class="srch" placeholder="🔍 Tìm nhóm sản phẩm..." onkeyup="filterTbl('tbl_type',this.value)">
    ${skuTable(t,'tbl_type',[
      {t:'Nhóm sản phẩm',r:r=>r.name},
      {t:'SL bán',num:1,r:r=>r.qty.toLocaleString('vi')},
      {t:'GMV',num:1,r:r=>fmtF(r.gmv)},
      {t:'Doanh thu',num:1,r:r=>fmtF(r.rev)},
      {t:'Giá vốn',num:1,r:r=>fmtF(r.cogs)},
      {t:'LN gộp',num:1,r:r=>`<span class="${r.gp>=0?'pos':'neg'}">${fmtF(r.gp)}</span>`},
      {t:'GM%',num:1,r:r=>`<span class="${r.gm>=0?'pos':'neg'}">${pct(r.gm)}</span>`},
    ])}
  </div>`;
};
PAGES.sku.draw=()=>{
  const t=D.by_type.slice(0,12).reverse();
  Plotly.newPlot('c_typegmv',[{y:t.map(x=>x.name),x:t.map(x=>x.gmv),type:'bar',orientation:'h',marker:{color:t.map(x=>x.gp>=0?C.grn:C.red)}}],{...PLT(),margin:{t:10,r:14,b:40,l:150}},CFG);
  const t2=D.by_type.slice(0,8);const other=D.by_type.slice(8).reduce((s,x)=>s+x.gmv,0);
  Plotly.newPlot('c_typepie',[{values:[...t2.map(x=>x.gmv),other],labels:[...t2.map(x=>x.name),'Khác'],type:'pie',hole:.45,textinfo:'percent'}],{...PLT(),margin:{t:10,r:10,b:10,l:10}},CFG);
};

PAGES.cogs.draw=()=>{
  const t=D.by_type.slice(0,12).reverse();
  Plotly.newPlot('c_gp',[{y:t.map(x=>x.name),x:t.map(x=>x.gp),type:'bar',orientation:'h',marker:{color:t.map(x=>x.gp>=0?C.grn:C.red)}}],{...PLT(),margin:{t:10,r:14,b:40,l:150}},CFG);
  const ts=[...D.by_type].sort((a,b)=>a.gm-b.gm).filter(x=>x.gmv>1e6);
  Plotly.newPlot('c_gm',[{y:ts.map(x=>x.name),x:ts.map(x=>x.gm*100),type:'bar',orientation:'h',marker:{color:ts.map(x=>x.gm>=0?C.grn:C.red)}}],{...PLT(),margin:{t:10,r:14,b:40,l:150},xaxis:{...PLT().xaxis,ticksuffix:'%'}},CFG);
};

    <div class="panel"><h3>ROAS theo chiến dịch <span class="note">(vạch vàng = hòa vốn)</span></h3><div id="c_roas" class="chart"></div></div>
  </div>
  <div class="panel"><h3>Chi tiết hiệu suất chiến dịch <span class="note">(Ads Hiển thị Sản phẩm)</span></h3>

PAGES.ads.draw=()=>{
  if(!D.has_ads)return;
  const c=D.campaigns;const nm=c.map(x=>x.name.length>22?x.name.slice(0,22)+'…':x.name);
  Plotly.newPlot('c_camp',[
    {x:nm,y:c.map(x=>x.cost),type:'bar',name:'Chi phí',marker:{color:C.pur}},
    {x:nm,y:c.map(x=>x.sales),type:'bar',name:'Doanh số',marker:{color:C.blu}}
  ],{...PLT(),barmode:'group',margin:{t:18,r:14,b:90,l:54}},CFG);
  Plotly.newPlot('c_roas',[
    {x:nm,y:c.map(x=>x.roas),type:'bar',marker:{color:c.map(x=>x.roas>=D.breakeven_roas?C.grn:C.red)},text:c.map(x=>x.roas.toFixed(2)),textposition:'outside'},
  ],{...PLT(),margin:{t:18,r:14,b:90,l:54},shapes:[{type:'line',x0:-.5,x1:c.length-.5,y0:D.breakeven_roas,y1:D.breakeven_roas,line:{color:C.yel,dash:'dash'}}]},CFG);
};

// 5b. ADS TỪ KHÓA
function kwTag(k,be){if(k.roas>=be*1.6)return '<span class="tag t-scale">ĐẨY MẠNH</span>';if(k.roas<be)return '<span class="tag t-stop">CẮT/GIẢM</span>';return '<span class="tag t-watch">THEO DÕI</span>'}
PAGES.keywords=()=>{
  if(!D.has_keywords){
    return `<div class="phead"><div><h2>Ads Từ khóa</h2><p>Phân tích quảng cáo từ khóa Shop</p></div></div>
    <div class="notebar">ℹ️ Shop không chạy <b>Ads Từ khóa Shop</b> trong kỳ này.</div>`;
  }
  const be=D.breakeven_roas;
  const kwRoas=D.gmv_kw/D.ads_kw, pdRoas=D.gmv_pd/D.ads_pd;
  const acosAvg=D.ads_kw/D.gmv_kw;
  const good=D.keywords.filter(k=>k.roas>=be).length, bad=D.keywords.filter(k=>k.roas<be&&k.cost>0).length;
  return `<div class="phead"><div><h2>Ads Từ khóa</h2><p>Phân tích ${D.keywords.length} từ khóa — hiệu quả & quyết định</p></div></div>
  <div class="kgrid">
    ${kpi('Chi phí từ khóa',fmt(D.ads_kw),pct(D.ads_kw/D.ads_spend)+' tổng Ads','p')}
    ${kpi('Doanh số từ khóa',fmt(D.gmv_kw),'Attributed','b')}
    ${kpi('ROAS từ khóa',kwRoas.toFixed(2),'BE-ROAS '+be.toFixed(2),kwRoas>=be?'g':'r')}
    ${kpi('ACOS trung bình',pct(acosAvg),'Chi phí / doanh số','y')}
    ${kpi('Số chuyển đổi',D.kw_conv.toLocaleString('vi'),'CVR '+pct(D.kw_conv/D.kw_clk),'')}
    ${kpi('Từ khóa lãi / lỗ',good+' / '+bad,'≥ / < ngưỡng hòa vốn',bad>good?'r':'g')}
  </div>
  <div class="row2">
    <div class="panel"><h3>So sánh 2 loại Ads <span class="note">(chi phí vs doanh số)</span></h3><div id="c_adsplit" class="chart"></div></div>
    <div class="panel"><h3>Top 12 từ khóa theo chi phí</h3><div id="c_kwtop" class="chart" style="height:360px"></div></div>
  </div>
  <div class="panel"><h3>Hiệu quả từ khóa <span class="note">(ROAS theo chi phí — bên phải vạch vàng là tốt)</span></h3><div id="c_kwscatter" class="chart"></div></div>
  <div class="panel" style="margin-top:16px"><h3>Chi tiết toàn bộ từ khóa</h3>
    <input class="srch" placeholder="🔍 Tìm từ khóa..." onkeyup="filterTbl('tbl_kw',this.value)">
    ${skuTable(D.keywords,'tbl_kw',[
      {t:'Từ khóa',r:r=>r.kw},
      {t:'Loại',r:r=>r.ktype},
      {t:'Lượt xem',num:1,r:r=>r.imp.toLocaleString('vi')},
      {t:'Click',num:1,r:r=>r.clk.toLocaleString('vi')},
      {t:'CTR%',num:1,r:r=>pct(r.ctr)},
      {t:'Chuyển đổi',num:1,r:r=>r.conv.toLocaleString('vi')},
      {t:'CVR%',num:1,r:r=>pct(r.cvr)},
      {t:'Chi phí',num:1,r:r=>fmtF(r.cost)},
      {t:'CP/CĐ',num:1,r:r=>fmtF(r.cpa)},
      {t:'Doanh số',num:1,r:r=>fmtF(r.sales)},
      {t:'ROAS',num:1,r:r=>`<span class="${r.roas>=be?'pos':'neg'}">${r.roas.toFixed(2)}</span>`},
      {t:'ACOS%',num:1,r:r=>pct(r.acos)},
      {t:'Quyết định',r:r=>kwTag(r,be)},
    ])}
  </div>
  <div class="bd-box" style="margin-top:16px"><h4>🔑 Đọc dữ liệu từ khóa</h4><ul>
    <li>Ads từ khóa ROAS <b class="${kwRoas>=be?'pos':'neg'}">${kwRoas.toFixed(2)}</b> ${kwRoas>=pdRoas?'≥':'<'} Ads hiển thị SP (${pdRoas.toFixed(2)}) — ${kwRoas>=pdRoas?'từ khóa hiệu quả hơn':'hiển thị SP hiệu quả hơn'}.</li>
    <li><b>${bad}</b> từ khóa có ROAS dưới ngưỡng hòa vốn ${be.toFixed(2)} → đang lỗ, nên cắt hoặc giảm giá thầu.</li>
    <li>Từ khóa nên đẩy mạnh (ROAS cao + chi tiêu đáng kể): ${D.keywords.filter(k=>k.roas>=be*1.6&&k.cost>500000).slice(0,4).map(k=>k.kw).join(', ')||'—'}.</li>
    <li>Từ khóa "đốt tiền" (chi phí cao, ROAS thấp): ${[...D.keywords].filter(k=>k.roas<be).sort((a,b)=>b.cost-a.cost).slice(0,3).map(k=>k.kw+' ('+k.roas.toFixed(1)+')').join(', ')||'—'}.</li>
  </ul></div>`;
};
PAGES.keywords.draw=()=>{
  if(!D.has_keywords)return;
  const be=D.breakeven_roas;
  Plotly.newPlot('c_adsplit',[
    {x:['Hiển thị SP','Từ khóa'],y:[D.ads_pd,D.ads_kw],type:'bar',name:'Chi phí',marker:{color:C.pur}},
    {x:['Hiển thị SP','Từ khóa'],y:[D.gmv_pd,D.gmv_kw],type:'bar',name:'Doanh số',marker:{color:C.blu}}
  ],{...PLT(),barmode:'group'},CFG);
  const top=[...D.keywords].slice(0,12).reverse();
  Plotly.newPlot('c_kwtop',[{y:top.map(k=>k.kw),x:top.map(k=>k.cost),type:'bar',orientation:'h',marker:{color:top.map(k=>k.roas>=be?C.grn:C.red)},text:top.map(k=>'ROAS '+k.roas.toFixed(1)),textposition:'auto'}],{...PLT(),margin:{t:10,r:14,b:40,l:160}},CFG);
  Plotly.newPlot('c_kwscatter',[{x:D.keywords.map(k=>k.cost),y:D.keywords.map(k=>k.roas),text:D.keywords.map(k=>k.kw),mode:'markers',type:'scatter',marker:{size:D.keywords.map(k=>Math.max(6,Math.sqrt(k.conv)*3)),color:D.keywords.map(k=>k.roas>=be?C.grn:C.red),opacity:.7}}],{...PLT(),xaxis:{...PLT().xaxis,title:'Chi phí (đ)'},yaxis:{...PLT().yaxis,title:'ROAS'},shapes:[{type:'line',x0:0,x1:Math.max(...D.keywords.map(k=>k.cost)),y0:be,y1:be,line:{color:C.yel,dash:'dash'}}]},CFG);
};

// 6. PROFIT / SKU
function decTag(r){if(r.gm<0)return '<span class="tag t-stop">DỪNG</span>';if(r.net<0)return '<span class="tag t-watch">XEM LẠI</span>';if(r.net>0&&r.nm>0.2)return '<span class="tag t-scale">SCALE</span>';return '<span class="tag t-watch">THEO DÕI</span>'}
PAGES.profit=()=>{
  const loss=D.by_sku.filter(x=>x.net<0).length;
  return `<div class="phead"><div><h2>Profit per SKU</h2><p>Lợi nhuận, biên LN & break-even theo SKU</p></div></div>
  <div class="kgrid">
    ${kpi('SKU có lãi (net>0)',D.by_sku.filter(x=>x.net>0).length+' / '+D.by_sku.length,'Sau phân bổ Ads','g')}
    ${kpi('SKU lỗ (net<0)',loss+' / '+D.by_sku.length,'Cần xem lại','r')}
    ${kpi('SKU GM âm',D.by_sku.filter(x=>x.gm<0).length,'Bán dưới giá vốn','r')}
    ${kpi('Net Profit tổng',fmt(D.net_profit),'NM '+pct(D.net_margin),D.net_profit>0?'g':'r')}
  </div>
  <div class="panel"><h3>ROAS thực tế vs Break-even ROAS theo nhóm</h3><div id="c_be" class="chart" style="height:360px"></div></div>
  <div class="panel" style="margin-top:16px"><h3>Bảng P&L theo SKU</h3>
    <input class="srch" placeholder="🔍 Tìm SKU..." onkeyup="filterTbl('tbl_pnl',this.value)">
    ${skuTable(D.by_sku,'tbl_pnl',[
      {t:'SKU',r:r=>r.name},
      {t:'Doanh thu',num:1,r:r=>fmtF(r.rev)},
      {t:'LN gộp',num:1,r:r=>`<span class="${r.gp>=0?'pos':'neg'}">${fmtF(r.gp)}</span>`},
      {t:'GM%',num:1,r:r=>`<span class="${r.gm>=0?'pos':'neg'}">${pct(r.gm)}</span>`},
      {t:'Ads (pb)',num:1,r:r=>fmtF(r.ads)},
      {t:'Net',num:1,r:r=>`<span class="${r.net>=0?'pos':'neg'}">${fmtF(r.net)}</span>`},
      {t:'NM%',num:1,r:r=>`<span class="${r.nm>=0?'pos':'neg'}">${pct(r.nm)}</span>`},
      {t:'BE-ROAS',num:1,r:r=>r.beroas>0?r.beroas.toFixed(2):'—'},
      {t:'Quyết định',r:r=>decTag(r)},
    ])}
  </div>`;
};
PAGES.profit.draw=()=>{
  const t=D.by_type.filter(x=>x.gmv>1e6);
  Plotly.newPlot('c_be',[
    {x:t.map(x=>x.name),y:t.map(x=>x.beroas),type:'bar',name:'Break-even ROAS',marker:{color:C.yel}},
    {x:t.map(x=>x.name),y:t.map(x=>D.roas_overall),type:'scatter',mode:'lines',name:'ROAS shop',line:{color:C.grn,dash:'dot'}}
  ],{...PLT(),margin:{t:18,r:14,b:110,l:54}},CFG);
};

// 7. FUNNEL
PAGES.funnel=()=>{
  const feePct=D.platform_fee/D.gmv, cogsPct=D.cogs_total/D.gmv, adsPct=D.ads_spend/D.gmv, affPct=D.aff_fee/D.gmv, netPct=D.net_profit/D.gmv;
  const cpa=D.tot_conv?D.ads_spend/D.tot_conv:0;
  const adKpi=D.has_ads
    ? kpi('Chi phí/chuyển đổi (CPA)',fmtF(cpa),D.tot_conv.toLocaleString('vi')+' chuyển đổi','p')
    : kpi('AOV',fmtF(D.aov),'Doanh thu / đơn','p');
  const convBlock=D.has_ads
    ? `<div class="row2">
        <div class="panel"><h3>🎯 Funnel chuyển đổi Ads</h3><div id="c_convfn" class="chart" style="height:330px"></div>
          <div style="display:flex;justify-content:space-around;margin-top:10px;font-size:12.5px">
            <div style="text-align:center"><div style="color:var(--mut)">CTR</div><div style="font-size:18px;font-weight:700;color:${C.blu}">${pct(D.tot_clk/D.tot_imp)}</div></div>
            <div style="text-align:center"><div style="color:var(--mut)">CVR</div><div style="font-size:18px;font-weight:700;color:${C.grn}">${pct(D.tot_conv/D.tot_clk)}</div></div>
            <div style="text-align:center"><div style="color:var(--mut)">ROAS</div><div style="font-size:18px;font-weight:700;color:${C.acc}">${D.roas_overall.toFixed(2)}</div></div>
          </div>
        </div>
        <div class="panel"><h3>Phân rã lợi nhuận (donut)</h3><div id="c_profitmix" class="chart" style="height:330px"></div></div>
      </div>
      <div class="panel" style="margin-top:16px"><h3>📊 Funnel theo từng chiến dịch</h3><div id="c_campfn" class="chart" style="height:300px"></div></div>`
    : `<div class="panel"><h3>Phân rã lợi nhuận (donut)</h3><div id="c_profitmix" class="chart" style="height:340px"></div></div>`;
  const adBox=D.has_ads
    ? `<div class="bd-box"><h4>🎯 Đọc funnel Ads</h4><ul>
        <li>${fmt(D.tot_imp)} lượt xem → CTR ${pct(D.tot_clk/D.tot_imp)} → ${D.tot_clk.toLocaleString('vi')} click.</li>
        <li>CVR ${pct(D.tot_conv/D.tot_clk)} → ${D.tot_conv.toLocaleString('vi')} chuyển đổi, CPA ${fmtF(cpa)}.</li>
        <li>ROAS tổng ${D.roas_overall.toFixed(2)} ${D.roas_overall>D.breakeven_roas?'>':'<'} hòa vốn ${D.breakeven_roas.toFixed(2)} → Ads ${D.roas_overall>D.breakeven_roas?'lành mạnh':'cần soát'}.</li>
        <li>GMV từ Ads ${fmt(D.gmv_ads)} — chiếm ${pct(D.gmv_ads/D.gmv)} GMV shop.</li>
      </ul></div>`
    : `<div class="bd-box"><h4>🌱 Kênh tăng trưởng</h4><ul>
        <li>Shop <b>không chạy Ads</b> — toàn bộ doanh thu từ tự nhiên/affiliate, nên biên ròng gần bằng biên gộp.</li>
        <li>Phí Affiliate chỉ ${fmt(D.aff_fee)} (${pct(D.aff_ratio)} doanh thu) → chi phí marketing rất thấp.</li>
        <li>Dư địa: nếu biên gộp ${pct(D.gross_margin)} đủ tốt, có thể thử Ads với ngưỡng hòa vốn ROAS ${D.breakeven_roas.toFixed(2)}.</li>
        <li>Hiện tại quy mô nhỏ (${D.n_completed_orders.toLocaleString('vi')} đơn) — ưu tiên kiểm thử sản phẩm & tăng đơn tự nhiên.</li>
      </ul></div>`;
  return `<div class="phead"><div><h2>Funnel & Dòng tiền lợi nhuận</h2><p>${D.has_ads?'Từ lượt hiển thị → đơn hàng, và từ ':'Từ '}GMV → lợi nhuận ròng</p></div></div>
  <div class="panel" style="margin-bottom:16px"><h3>💧 Dòng tiền: GMV phân rã đến Lợi nhuận ròng <span class="note">(mỗi 100đ GMV còn lại bao nhiêu)</span></h3>
    <div id="c_waterfall" class="chart" style="height:380px"></div>
  </div>
  <div class="kgrid">
    ${kpi('100đ GMV → Doanh thu thuần',Math.round(D.revenue/D.gmv*100)+'đ','Sau phí sàn + aff + trợ giá','y')}
    ${kpi('→ Lợi nhuận gộp',Math.round((D.gross_profit/D.gmv)*100)+'đ','Trừ '+Math.round(cogsPct*100)+'đ giá vốn','y')}
    ${kpi('→ Lợi nhuận ròng',Math.round(netPct*100)+'đ','Sau Ads + Affiliate',netPct>0?'g':'r')}
    ${adKpi}
  </div>
  ${convBlock}
  <div class="bd-grid" style="margin-top:16px">
    <div class="bd-box"><h4>🔎 Đọc dòng tiền</h4><ul>
      <li>Cứ 100đ GMV, sàn + affiliate + trợ giá lấy <b class="neg">${Math.round((1-D.revenue/D.gmv)*100)}đ</b> → còn <b>${Math.round(D.revenue/D.gmv*100)}đ</b> doanh thu thuần.</li>
      <li>Giá vốn ăn <b class="neg">${Math.round(cogsPct*100)}đ</b>, để lại <b>${Math.round(D.gross_profit/D.gmv*100)}đ</b> lợi nhuận gộp.</li>
      <li>Ads ${Math.round(adsPct*100)}đ → còn <b class="${netPct>0?'pos':'neg'}">${Math.round(netPct*100)}đ</b> lợi nhuận ròng.</li>
      <li>Net margin ${pct(D.net_margin)} ${D.net_margin<0.1?'(mỏng — nhạy với biến động phí/giá vốn)':'(khá tốt)'}.</li>
    </ul></div>
    ${adBox}
  </div>`;
};
PAGES.funnel.draw=()=>{
  const w=D.waterfall;
  const measure=w.map(s=>s.type==='rel'?'relative':'total');
  Plotly.newPlot('c_waterfall',[{
    type:'waterfall',orientation:'v',measure:measure,
    x:w.map(s=>s.label),y:w.map(s=>s.value),
    text:w.map(s=>fmt(Math.abs(s.value))),textposition:'outside',
    connector:{line:{color:'#2a3344'}},
    increasing:{marker:{color:C.grn}},decreasing:{marker:{color:C.red}},totals:{marker:{color:C.blu}}
  }],{...PLT(),margin:{t:30,r:14,b:90,l:60},xaxis:{...PLT().xaxis,tickfont:{size:10}}},CFG);

  Plotly.newPlot('c_profitmix',[{values:[D.platform_fee,D.cogs_total,D.ads_spend,D.aff_fee,(D.shipping_fee||0)+(D.discount_subsidy||0),Math.max(0,D.net_profit)],labels:['Phí sàn','Giá vốn','Ads','Affiliate','VC & trợ giá','LN ròng'],type:'pie',hole:.5,marker:{colors:[C.red,C.yel,C.pur,C.blu,'#7d8db3',C.grn]},textinfo:'percent'}],{...PLT(),margin:{t:10,r:10,b:10,l:10}},CFG);

  if(!D.has_ads)return;
  Plotly.newPlot('c_convfn',[{type:'funnel',y:['Lượt xem','Click','Chuyển đổi'],x:[D.tot_imp,D.tot_clk,D.tot_conv],marker:{color:[C.blu,C.acc2,C.grn]},textinfo:'value+percent initial'}],{...PLT(),margin:{t:10,r:14,b:20,l:80}},CFG);

  const c=D.camp_funnel;const nm=c.map(x=>x.name.length>20?x.name.slice(0,20)+'…':x.name);
  Plotly.newPlot('c_campfn',[
    {x:nm,y:c.map(x=>x.imp),type:'bar',name:'Lượt xem',marker:{color:C.blu},yaxis:'y'},
    {x:nm,y:c.map(x=>x.conv),type:'bar',name:'Chuyển đổi',marker:{color:C.grn},yaxis:'y2'}
  ],{...PLT(),margin:{t:18,r:50,b:80,l:60},barmode:'group',yaxis:{...PLT().yaxis,title:'Lượt xem'},yaxis2:{overlaying:'y',side:'right',title:'Chuyển đổi',gridcolor:'transparent'}},CFG);
};

// 8. ALERTS
PAGES.alerts=()=>{
  const lossSku=D.by_sku.filter(x=>x.net<0).sort((a,b)=>a.net-b.net);
  const negGM=D.by_sku.filter(x=>x.gm<0).sort((a,b)=>a.gm-b.gm);
  const cancRate=D.n_cancel_orders/D.total_unique_orders;
  const big=D.by_type[0];
  const gmGmv=(D.gmv-D.cogs_total)/D.gmv;
  const nm=x=>x.name.split('|')[0].trim();
  let A=[];
  if(negGM.length)A.push({c:'crit',i:'🩸',t:`${negGM.length} SKU bán DƯỚI giá vốn (GM âm)`,d:`Nặng nhất: ${negGM.slice(0,4).map(x=>nm(x)+' ('+pct(x.gm)+')').join(', ')}. Đây là lỗ gộp — bán càng nhiều lỗ càng lớn.`});
  if(big.net<0)A.push({c:'crit',i:'⚠️',t:`Nhóm doanh số #1 "${nm(big)}" đang LỖ ròng ${fmtF(big.net)}`,d:`GMV ${fmtF(big.gmv)} (lớn nhất shop) nhưng GM chỉ ${pct(big.gm)} → không gánh nổi chi phí. Doanh số cao nhưng "đốt tiền".`});
  if(cancRate>0.1)A.push({c:'warn',i:'🔄',t:`Tỷ lệ hủy đơn cao: ${pct(cancRate)} (${D.n_cancel_orders}/${D.total_unique_orders})`,d:`Giá trị đơn hủy ${fmtF(D.cancel_value)}. Cần soát nguyên nhân hủy (hết hàng, sai giá, ship chậm) để thu hồi doanh số.`});
  if(D.platform_fee/D.gmv>0.2)A.push({c:'warn',i:'💸',t:`Phí sàn chiếm ${pct(D.platform_fee/D.gmv)} GMV`,d:`Hoa hồng + dịch vụ + thanh toán = ${fmtF(D.platform_fee)}. Làm biên gộp rơi từ ${pct(gmGmv)} (trên GMV) xuống ${pct(D.gross_margin)} (trên doanh thu).`});
  if(lossSku.length)A.push({c:'warn',i:'📉',t:`${lossSku.length}/${D.by_sku.length} SKU lỗ ròng`,d:`Top lỗ: ${lossSku.slice(0,4).map(x=>nm(x)+' ('+fmt(x.net)+')').join(', ')}.`});
  if(D.has_ads&&D.roas_overall>D.breakeven_roas)A.push({c:'ok',i:'✅',t:`Ads hiệu quả: ROAS ${D.roas_overall.toFixed(2)} > BE-ROAS ${D.breakeven_roas.toFixed(2)}`,d:`${D.campaigns.filter(x=>x.roas>=D.breakeven_roas).length}/${D.campaigns.length} chiến dịch có ROAS vượt ngưỡng hòa vốn. Dư địa tăng ngân sách còn lớn.`});
  if(D.has_ads&&D.roas_overall<D.breakeven_roas)A.push({c:'crit',i:'🔥',t:`Ads dưới ngưỡng hòa vốn: ROAS ${D.roas_overall.toFixed(2)} < BE-ROAS ${D.breakeven_roas.toFixed(2)}`,d:`Đang lỗ trên mỗi đồng Ads. Cần cắt/tối ưu chiến dịch yếu ngay.`});
  if(!D.has_ads)A.push({c:'ok',i:'🌱',t:`Shop không chạy Ads — chi phí marketing rất thấp`,d:`Doanh thu từ tự nhiên/affiliate, phí Affiliate chỉ ${pct(D.aff_ratio)} doanh thu. Biên ròng ${pct(D.net_margin)} gần bằng biên gộp ${pct(D.gross_margin)}.`});
  if(D.net_margin>=0.25)A.push({c:'ok',i:'💎',t:`Biên lợi nhuận ròng khỏe: ${pct(D.net_margin)}`,d:`LN ròng ${fmtF(D.net_profit)} trên doanh thu ${fmtF(D.revenue)}. Tập trung scale nhóm sản phẩm đầu tàu.`});
  if(!A.length)A.push({c:'ok',i:'✅',t:`Không phát hiện cảnh báo nghiêm trọng`,d:`Các chỉ số trong ngưỡng an toàn.`});
  return `<div class="phead"><div><h2>Trends & Alerts</h2><p>Cảnh báo tự động từ dữ liệu</p></div></div>
  ${A.map(a=>`<div class="alert-card ${a.c}"><div class="ai">${a.i}</div><div><div class="at">${a.t}</div><div class="ad">${a.d}</div></div></div>`).join('')}`;
};

// 9. BUSINESS DECISION
PAGES.decision=()=>{
  const T=D.by_type;
  const topProfit=[...T].filter(x=>x.net>0).sort((a,b)=>b.net-a.net).slice(0,3);
  const worstNet=[...T].filter(x=>x.net<0).sort((a,b)=>a.net-b.net).slice(0,3);
  const negGM=D.by_sku.filter(x=>x.gm<0);
  const scale=D.by_sku.filter(x=>x.net>0&&x.nm>0.2).sort((a,b)=>b.net-a.net).slice(0,5);
  const cut=D.by_sku.filter(x=>x.gm<0).sort((a,b)=>a.net-b.net).slice(0,5);
  const watch=D.by_sku.filter(x=>x.net<0&&x.gm>=0).sort((a,b)=>a.net-b.net).slice(0,5);
  const big=T[0];
  const cancRate=D.n_cancel_orders/D.total_unique_orders;
  const conc=big.gmv/D.gmv;
  const healthy=D.net_margin>=0.15;
  const gmGate=1/D.roas_overall+0.15;
  const nm=x=>x.name.split('|')[0].trim();
  return `<div class="phead"><div><h2>Business Decision</h2><p>Góc nhìn Giám đốc Kinh doanh — mọi kết luận dựa trên dữ liệu ${D.period||''}</p></div></div>
  <div class="kgrid">
    ${kpi('Doanh thu',fmt(D.revenue),'','b')}
    ${kpi('LN ròng',fmt(D.net_profit),'NM '+pct(D.net_margin),D.net_profit>0?'g':'r')}
    ${kpi('GM trung bình',pct(D.gross_margin),'','y')}
    ${kpi('SKU lỗ ròng',D.by_sku.filter(x=>x.net<0).length+'/'+D.by_sku.length,negGM.length+' SKU GM âm',negGM.length?'r':'g')}
  </div>
  <div class="bd-grid">
    <div class="bd-box"><h4>💪 Điểm mạnh</h4><ul>
      ${topProfit.map(x=>`<li><b>${nm(x)}</b>: LN ròng <b class="pos">${fmt(x.net)}</b>, NM ${pct(x.nm)}, GM ${pct(x.gm)} — ${x===topProfit[0]?'đầu tàu lợi nhuận':'biên tốt'}.</li>`).join('')}
      <li>Biên lợi nhuận ${healthy?'<b class="pos">khỏe</b>':'mỏng'}: Gross Margin ${pct(D.gross_margin)}, Net Margin ${pct(D.net_margin)}.</li>
      <li>Ads ${D.roas_overall>D.breakeven_roas?'hiệu quả':'cần soát'}: ROAS <b class="${D.roas_overall>D.breakeven_roas?'pos':'neg'}">${D.roas_overall.toFixed(2)}</b> ${D.roas_overall>D.breakeven_roas?'vượt':'dưới'} ngưỡng hòa vốn ${D.breakeven_roas.toFixed(2)}.</li>
      <li>Quy mô: ${D.n_completed_orders.toLocaleString('vi')} đơn hoàn thành, AOV ${fmtF(D.aov)}.</li>
    </ul></div>
    <div class="bd-box"><h4>🚨 Điểm yếu / Rủi ro</h4><ul>
      ${negGM.length?`<li><b class="neg">${negGM.length} SKU bán dưới giá vốn</b> (GM âm) — lỗ gộp trực tiếp, càng bán càng lỗ.</li>`:''}
      ${big.net<0?`<li><b>${nm(big)}</b> doanh số #1 (${fmt(big.gmv)}) nhưng GM chỉ ${pct(big.gm)} → <b class="neg">lỗ ròng ${fmt(big.net)}</b>. Đang "mua doanh số bằng lỗ".</li>`:`<li>Phụ thuộc lớn vào <b>${nm(big)}</b> (${pct(conc)} GMV). Rủi ro tập trung: nếu nhóm này hụt hơi, lợi nhuận shop lung lay.</li>`}
      ${worstNet.length?`<li>Nhóm lỗ ròng: ${worstNet.map(x=>nm(x)+' ('+fmt(x.net)+')').join(', ')}.</li>`:''}
      <li>Tỷ lệ hủy <b class="${cancRate>0.1?'neg':''}">${pct(cancRate)}</b> (giá trị ${fmt(D.cancel_value)}); phí sàn ${pct(D.platform_fee/D.gmv)} GMV.</li>
    </ul></div>
    <div class="bd-box"><h4>🚀 SKU nên đẩy mạnh (SCALE)</h4><ul>
      ${scale.length?scale.map(x=>`<li><b>${nm(x)}</b> — Net ${fmt(x.net)}, NM ${pct(x.nm)}, GM ${pct(x.gm)}. Tăng ngân sách Ads & mở rộng tệp.</li>`).join(''):'<li>Chưa có SKU đạt ngưỡng scale (NM>20%).</li>'}
    </ul></div>
    <div class="bd-box"><h4>✂️ SKU nên giảm Ads / xử lý</h4><ul>
      ${cut.length?cut.map(x=>`<li><b class="neg">${nm(x)}</b> — GM ${pct(x.gm)} (dưới giá vốn). Dừng Ads, đàm phán giá nhập hoặc tăng giá bán.</li>`).join(''):''}
      ${watch.slice(0,3).map(x=>`<li class="warnc"><b>${nm(x)}</b> — GM dương ${pct(x.gm)} nhưng net âm: cắt Ads để về hòa vốn.</li>`).join('')}
      ${!cut.length&&!watch.length?'<li class="pos">Không có SKU cần cắt — danh mục lành mạnh.</li>':''}
    </ul></div>
  </div>
  <div class="bd-box" style="margin-top:16px"><h4>🎯 Khuyến nghị tháng tới</h4><ul>
    ${negGM.length?`<li><b>Xử lý lỗ gộp (ưu tiên #1):</b> ${negGM.length} SKU GM âm — đàm phán giá nhập, tăng giá bán, hoặc loại khỏi danh mục. Lỗ tăng theo sản lượng nên phải chặn trước.</li>`:`<li><b>Giữ kỷ luật biên:</b> không có SKU lỗ gộp — duy trì cơ cấu giá nhập/giá bán hiện tại.</li>`}
    <li><b>Tái phân bổ Ads:</b> dồn ngân sách vào ${topProfit.map(nm).join(', ')} (biên cao); ${worstNet.length?'cắt/giảm Ads nhóm '+worstNet.map(nm).join(', ')+'.':'siết Ads ở SKU net âm.'}</li>
    <li><b>Gate biên Ads:</b> chỉ chạy Ads cho SKU có GM ≥ <b>${pct(gmGate)}</b> (= 1/ROAS + đệm 15%) để đảm bảo lãi sau Ads. Ngưỡng break-even ROAS ${D.breakeven_roas.toFixed(2)}.</li>
    ${cancRate>0.1?`<li><b>Giảm tỷ lệ hủy ${pct(cancRate)}:</b> rà tồn kho & tốc độ xử lý đơn — thu hồi phần lớn trong ${fmt(D.cancel_value)} GMV đang mất.</li>`:''}
    ${conc>0.4?`<li><b>Giảm rủi ro tập trung:</b> ${nm(big)} chiếm ${pct(conc)} GMV — phát triển thêm 1–2 SKU biên cao làm trụ thứ hai.</li>`:''}
    <li><b>Hiện trạng:</b> LN ròng ${fmt(D.net_profit)} (NM ${pct(D.net_margin)}). ${healthy?'Shop lãi tốt — tập trung scale nhóm đầu tàu.':'Biên mỏng — ưu tiên cải thiện biên trước khi mở rộng quy mô.'}</li>
  </ul></div>`;
};

// ---------- ROUTER ----------
function whenPlotly(cb,tries){tries=tries||0;if(typeof Plotly!=='undefined'){requestAnimationFrame(()=>requestAnimationFrame(cb));}else if(tries<100){setTimeout(()=>whenPlotly(cb,tries+1),50);}}
function render(p){
  currentPage=p;
  document.getElementById('main').innerHTML=PAGES[p]();
  if(PAGES[p].draw)whenPlotly(()=>{try{PAGES[p].draw();}catch(e){console.error('draw error',p,e);}
    setTimeout(()=>document.querySelectorAll('.js-plotly-plot').forEach(el=>{try{Plotly.Plots.resize(el)}catch(e){}}),60);
  });
}
document.querySelectorAll('.navitem').forEach(n=>n.onclick=()=>{
  document.querySelectorAll('.navitem').forEach(x=>x.classList.remove('active'));
  n.classList.add('active');render(n.dataset.p);
});
// ---------- TABLE UTILS ----------
function filterTbl(id,q){q=q.toLowerCase();document.querySelectorAll('#'+id+' tbody tr').forEach(tr=>{tr.style.display=tr.textContent.toLowerCase().includes(q)?'':'none'})}
function sortTbl(id,col,num){const t=document.getElementById(id),tb=t.tBodies[0],rows=[...tb.rows];const dir=t.dataset.sc==col+'a'?-1:1;t.dataset.sc=col+(dir==1?'a':'d');
  const parse=s=>num?parseFloat(s.replace(/[^\d.\-]/g,''))||0:s.toLowerCase();
  rows.sort((a,b)=>{const x=parse(a.cells[col].textContent),y=parse(b.cells[col].textContent);return x<y?-dir:x>y?dir:0});rows.forEach(r=>tb.appendChild(r))}
function setShop(k){activeShop=k;D=SHOPS[k];document.querySelectorAll('.shoptab').forEach(t=>t.classList.toggle('active',t.dataset.shop===k));render(currentPage);}
(function(){const bar=document.getElementById('topbar');SHOP_ORDER.forEach((k,i)=>{const d=SHOPS[k];const el=document.createElement('div');el.className='shoptab'+(i===0?' active':'');el.dataset.shop=k;el.innerHTML=`<span class="sn">${d.shop}</span><span class="sm">DT ${fmt(d.revenue)} · LN ${fmt(d.net_profit)}</span>`;el.onclick=()=>setShop(k);bar.appendChild(el);});})();
render('overview');
</script>
</body>
</html>
